<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Monotonicity without jmax (n=100) - Gordon & Qiu (2018)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; display: flex; justify-content: center; padding: 20px; }
    .container { display: flex; flex-direction: column; align-items: center; }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 15px; font-family: Georgia, 'Times New Roman', serif; }
    .subtitle { font-size: 16px; color: #666; margin-bottom: 15px; font-style: italic; }
    canvas { border: 1px solid #e5e7eb; border-radius: 4px; }
    .legend { display: flex; gap: 20px; margin-top: 15px; font-size: 14px; flex-wrap: wrap; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-circle { width: 18px; height: 18px; border-radius: 50%; }
    .controls { display: flex; gap: 12px; margin-top: 20px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-gray { background: #6b7280; color: white; }
    .btn-gray:hover:not(:disabled) { background: #4b5563; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover:not(:disabled) { background: #2563eb; }
    .btn-yellow { background: #f59e0b; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .status { margin-top: 15px; text-align: center; min-height: 50px; }
    .status-step { font-weight: 600; font-size: 16px; color: #333; }
    .status-detail { color: #666; font-size: 14px; margin-top: 5px; }
    .status-waiting { color: #888; font-size: 15px; }
    .speed-control { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
    .speed-control input { width: 120px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Binary Monotonicity without j<sub>max</sub> (n = n' = 100)</h1>
    <p class="subtitle">Gordon & Qiu (2018) - Divide and Conquer Algorithm</p>
    <canvas id="canvas"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-circle" style="background: #e5e7eb;"></div><span>Full grid</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #fef3c7; border: 2px solid #f59e0b;"></div><span>Search region</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #3b82f6;"></div><span>Previous g(i)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #22c55e;"></div><span>Current g(i)</span></div>
    </div>
    <div class="controls">
      <button class="btn btn-gray" id="btnStepBack">◀ Step</button>
      <button class="btn btn-blue" id="btnPlay">▶ Play</button>
      <button class="btn btn-gray" id="btnStepForward">Step ▶</button>
      <button class="btn btn-green" id="btnReplay">↺ Replay</button>
    </div>
    <div class="speed-control">
      <span>Speed:</span>
      <input type="range" id="speedSlider" min="20" max="500" value="100">
      <span id="speedLabel">100ms</span>
    </div>
    <div class="status" id="status"><p class="status-waiting">Press Play to start animation</p></div>
  </div>

  <script>
    const n = 100;
    const cellSize = 6;
    const padding = 50;
    const width = n * cellSize + padding * 2;
    const height = n * cellSize + padding * 2;
    
    const canvas = document.getElementById('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    
    const computeOptimalJ = (i) => Math.min(Math.max(1, Math.floor(0.8 * i + 5)), n);
    
    const optimalChoices = [];
    for (let i = 1; i <= n; i++) {
      optimalChoices.push(computeOptimalJ(i));
    }
    
    function generateHistory() {
      const history = [];
      const solved = new Array(n).fill(false);
      const gValues = new Array(n).fill(0);
      
      const g1 = optimalChoices[0];
      gValues[0] = g1; solved[0] = true;
      history.push({ i: 1, j: g1, lower: 1, upper: n, solved: [...solved], gValues: [...gValues] });
      
      const gn = optimalChoices[n - 1];
      gValues[n - 1] = gn; solved[n - 1] = true;
      history.push({ i: n, j: gn, lower: g1, upper: n, solved: [...solved], gValues: [...gValues] });
      
      const stack = [[0, n - 1]];
      while (stack.length > 0) {
        const [iLow, iHigh] = stack.pop();
        if (iHigh - iLow <= 1) continue;
        const iMid = Math.floor((iLow + iHigh) / 2);
        const gMid = optimalChoices[iMid];
        const lower = gValues[iLow];
        const upper = gValues[iHigh];
        gValues[iMid] = gMid; solved[iMid] = true;
        history.push({ i: iMid + 1, j: gMid, lower, upper, solved: [...solved], gValues: [...gValues] });
        stack.push([iLow, iMid]); stack.push([iMid, iHigh]);
      }
      return history;
    }
    
    const history = generateHistory();
    let currentStep = -1, isPlaying = false, playTimer = null, playSpeed = 100;
    
    document.getElementById('speedSlider').addEventListener('input', (e) => {
      playSpeed = parseInt(e.target.value);
      document.getElementById('speedLabel').textContent = playSpeed + 'ms';
    });
    
    function drawCircle(x, y, radius, fill, stroke, strokeWidth) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeWidth; ctx.stroke(); }
    }
    
    function render() {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, width, height);
      const data = currentStep >= 0 ? history[currentStep] : null;
      const radius = 2.5;
      
      // Layer 1: All grid points (light gray background)
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          const x = padding + i * cellSize + cellSize / 2;
          const y = height - padding - j * cellSize - cellSize / 2;
          drawCircle(x, y, radius - 0.5, '#f0f0f0', '#e0e0e0', 0.3);
        }
      }
      
      if (data) {
        const iCurrent = data.i;
        
        // Layer 2: All previous search regions (light yellow, accumulated)
        for (let step = 0; step <= currentStep; step++) {
          const h = history[step];
          const iPrev = h.i;
          for (let j = h.lower; j <= h.upper; j++) {
            const x = padding + (iPrev - 1) * cellSize + cellSize / 2;
            const y = height - padding - (j - 1) * cellSize - cellSize / 2;
            if (step === currentStep) {
              // Current search region (brighter yellow)
              drawCircle(x, y, radius + 0.5, '#fef3c7', '#f59e0b', 1);
            } else {
              // Previous search regions (lighter yellow)
              drawCircle(x, y, radius, '#fef9c3', '#fcd34d', 0.5);
            }
          }
        }
        
        // Layer 3: Previous optimal points (blue)
        for (let i = 0; i < n; i++) {
          if (data.solved[i] && i !== iCurrent - 1) {
            const x = padding + i * cellSize + cellSize / 2;
            const y = height - padding - (data.gValues[i] - 1) * cellSize - cellSize / 2;
            drawCircle(x, y, radius, '#3b82f6', '#1d4ed8', 0.5);
          }
        }
        
        // Layer 4: Current optimal (green)
        const x = padding + (iCurrent - 1) * cellSize + cellSize / 2;
        const y = height - padding - (data.j - 1) * cellSize - cellSize / 2;
        drawCircle(x, y, radius + 1.5, '#22c55e', '#15803d', 1);
      }
      
      // Axes
      ctx.fillStyle = '#333';
      ctx.font = 'italic 18px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('i', width / 2, height - 12);
      ctx.save();
      ctx.translate(15, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("i'", 0, 0);
      ctx.restore();
      
      updateStatus();
    }
    
    function updateStatus() {
      const statusEl = document.getElementById('status');
      if (currentStep < 0) {
        statusEl.innerHTML = '<p class="status-waiting">Press Play to start animation</p>';
      } else {
        const data = history[currentStep];
        const searchSize = data.upper - data.lower + 1;
        statusEl.innerHTML = `<p class="status-step">Step ${currentStep + 1} / ${history.length}: Solving g(${data.i})</p>
          <p class="status-detail">Search region: [${data.lower}, ${data.upper}] (size: ${searchSize}) → g(${data.i}) = ${data.j}</p>`;
      }
    }
    
    function updateButtons() {
      document.getElementById('btnStepBack').disabled = currentStep <= 0;
      document.getElementById('btnStepForward').disabled = currentStep >= history.length - 1;
      document.getElementById('btnPlay').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      document.getElementById('btnPlay').className = isPlaying ? 'btn btn-yellow' : 'btn btn-blue';
    }
    
    function play() {
      if (currentStep >= history.length - 1) currentStep = -1;
      isPlaying = true;
      if (currentStep < 0) currentStep = 0;
      render(); updateButtons();
      playTimer = setInterval(() => {
        if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); }
        else pause();
      }, playSpeed);
    }
    
    function pause() { isPlaying = false; if (playTimer) { clearInterval(playTimer); playTimer = null; } updateButtons(); }
    function stepBack() { if (currentStep > 0) { currentStep--; render(); updateButtons(); } }
    function stepForward() { if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); } }
    function replay() { pause(); currentStep = -1; setTimeout(play, 100); }
    
    document.getElementById('btnPlay').addEventListener('click', () => { isPlaying ? pause() : play(); });
    document.getElementById('btnStepBack').addEventListener('click', stepBack);
    document.getElementById('btnStepForward').addEventListener('click', stepForward);
    document.getElementById('btnReplay').addEventListener('click', replay);
    
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); isPlaying ? pause() : play(); }
      else if (e.code === 'ArrowLeft') stepBack();
      else if (e.code === 'ArrowRight') stepForward();
      else if (e.code === 'KeyR') replay();
    });
    
    render(); updateButtons();
  </script>
</body>
</html>
