<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taste Shocks with BM + BC (n=20) - Gordon (2019)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; display: flex; justify-content: center; padding: 20px; }
    .container { display: flex; flex-direction: column; align-items: center; }
    .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; font-family: Georgia, 'Times New Roman', serif; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 15px; font-style: italic; }
    canvas { border: 1px solid #e5e7eb; border-radius: 4px; }
    .legend { display: flex; gap: 12px; margin-top: 15px; font-size: 12px; flex-wrap: wrap; justify-content: center; max-width: 620px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-circle { width: 14px; height: 14px; border-radius: 50%; }
    .sigmabox { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 14px; }
    .sigmabox input { width: 260px; }
    .sigmaval { font-family: Georgia, serif; font-style: italic; min-width: 110px; }
    .controls { display: flex; gap: 12px; margin-top: 14px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-gray { background: #6b7280; color: white; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-yellow { background: #f59e0b; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .status { margin-top: 15px; text-align: center; min-height: 86px; max-width: 620px; }
    .status-step { font-weight: 600; font-size: 15px; color: #333; }
    .status-detail { color: #666; font-size: 13px; margin-top: 5px; line-height: 1.5; }
    .status-waiting { color: #888; font-size: 15px; }
    .tally { margin-top: 4px; font-size: 13px; color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Taste Shocks with BM + BC (n = n' = 20)</h1>
    <p class="subtitle">Gordon (2019), two-period example &nbsp;U(i,i&prime;) = log(b<sub>i</sub> &minus; b<sub>i&prime;</sub>/2) + log(b<sub>i&prime;</sub>) &nbsp;with&nbsp; b<sub>i</sub> = i</p>
    <canvas id="canvas"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-circle" style="background: #f0f0f0; border: 1px solid #e0e0e0;"></div><span>Feasible</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #fef3c7; border: 2px solid #f59e0b;"></div><span>Search bounds (BM)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #93c5fd; border: 1px solid #3b82f6;"></div><span>Relevant band, shaded by P(i'|i)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #bbf7d0; border: 2px solid #22c55e;"></div><span>Evaluated</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #ef4444;"></div><span>j<sub>max</sub></span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #22c55e;"></div><span>Current g(i)</span></div>
    </div>

    <div class="sigmabox">
      <label for="sigma">taste shock size &sigma;</label>
      <input type="range" id="sigma" min="0" max="100" value="42">
      <span class="sigmaval" id="sigmaval"></span>
    </div>

    <div class="controls">
      <button class="btn btn-gray" id="btnStepBack">&#9664; Step</button>
      <button class="btn btn-blue" id="btnPlay">&#9654; Play</button>
      <button class="btn btn-gray" id="btnStepForward">Step &#9654;</button>
      <button class="btn btn-green" id="btnReplay">&#8634; Replay</button>
    </div>
    <div class="status" id="status"><p class="status-waiting">Press Play to start animation</p></div>
  </div>

  <script>
    const n = 20;
    const cellSize = 26;
    const padding = 50;
    const width = n * cellSize + padding * 2;
    const height = n * cellSize + padding * 2;

    const canvas = document.getElementById('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    const EPS = 1e-16;                       // machine epsilon for double precision

    // Gordon (2019), section 2.1 : b_i = i and a two-period consumption-savings payoff.
    // Feasibility needs b_i - b_j/2 > 0, that is j <= 2i - 1.
    const b = (i) => i;
    const computeJmax = (i) => Math.min(n, 2 * i - 1);
    const U = (i, j) => Math.log(b(i) - b(j) / 2) + Math.log(b(j));

    const jmaxValues = [], optimalChoices = [];
    for (let i = 1; i <= n; i++) jmaxValues.push(computeJmax(i));
    for (let i = 1; i <= n; i++) {
      let best = 1;
      for (let j = 1; j <= jmaxValues[i - 1]; j++) if (U(i, j) > U(i, best)) best = j;
      optimalChoices.push(best);
    }

    // choice probability of j at state i, for the current sigma
    function choiceProb(i, j, sigma) {
      let mx = -Infinity;
      for (let k = 1; k <= jmaxValues[i - 1]; k++) mx = Math.max(mx, U(i, k));
      let den = 0;
      for (let k = 1; k <= jmaxValues[i - 1]; k++) den += Math.exp((U(i, k) - mx) / sigma);
      return Math.exp((U(i, j) - mx) / sigma) / den;
    }

    // binary concavity: locate the peak inside [lo,hi]
    function binaryConcavity(i, lo, hi) {
      const ev = [];
      let l = lo, r = hi;
      while (r - l > 2) {
        const mid = Math.floor((l + r) / 2);
        ev.push(mid, mid + 1);
        if (U(i, mid + 1) > U(i, mid)) l = mid + 1; else r = mid;
      }
      for (let j = l; j <= r; j++) if (!ev.includes(j)) ev.push(j);
      let best = l;
      for (let j = l; j <= r; j++) if (U(i, j) > U(i, best)) best = j;
      return { best, ev };
    }

    // peak, then walk outward until the log odds fall below sigma*log(eps)
    function relevantBand(i, lo, hi, sigma) {
      const cut = sigma * Math.log(EPS);
      const { best, ev } = binaryConcavity(i, lo, hi);
      const Ustar = U(i, best);
      let l = best, h = best;
      while (l > lo) { ev.push(l - 1); if (U(i, l - 1) - Ustar < cut) break; l--; }
      while (h < hi) { ev.push(h + 1); if (U(i, h + 1) - Ustar < cut) break; h++; }
      const uniq = [...new Set(ev)].sort((a, b) => a - b);
      return { g: best, l, h, ev: uniq };
    }

    function generateHistory(sigma) {
      const history = [];
      const lArr = new Array(n + 1).fill(0), hArr = new Array(n + 1).fill(0);
      const gArr = new Array(n + 1).fill(0), solved = new Array(n + 1).fill(false);
      const bands = [], evals = [];
      let total = 0;

      function record(i, lo, hi, res) {
        lArr[i] = res.l; hArr[i] = res.h; gArr[i] = res.g; solved[i] = true;
        total += res.ev.length;
        bands.push({ i, l: res.l, h: res.h });
        evals.push({ i, points: res.ev });
        history.push({
          i, g: res.g, lo, hi, l: res.l, h: res.h, ev: res.ev, total,
          bands: JSON.parse(JSON.stringify(bands)),
          evals: JSON.parse(JSON.stringify(evals)),
          gArr: [...gArr], solved: [...solved]
        });
      }

      record(1, 1, jmaxValues[0], relevantBand(1, 1, jmaxValues[0], sigma));
      record(n, lArr[1], jmaxValues[n - 1], relevantBand(n, lArr[1], jmaxValues[n - 1], sigma));

      const stack = [[1, n]];
      while (stack.length > 0) {
        const [a, b] = stack.pop();
        if (b - a <= 1) continue;
        const m = Math.floor((a + b) / 2);
        const lo = lArr[a], hi = Math.min(hArr[b], jmaxValues[m - 1]);
        record(m, lo, hi, relevantBand(m, lo, hi, sigma));
        stack.push([a, m]); stack.push([m, b]);
      }
      return history;
    }

    // sigma slider: log spaced from 0.0002 to 0.05
    const sigmaFromSlider = (v) => Math.exp(Math.log(0.0002) + (v / 100) * (Math.log(0.05) - Math.log(0.0002)));
    let sigma = sigmaFromSlider(42);
    let history = generateHistory(sigma);
    let currentStep = -1, isPlaying = false, playTimer = null;
    const playSpeed = 800;

    function drawCircle(x, y, radius, fill, stroke, strokeWidth) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeWidth; ctx.stroke(); }
    }

    // darker blue for a higher choice probability
    function bandColour(p) {
      const t = Math.max(0, Math.min(1, (Math.log10(p) + 16) / 16));
      const r = Math.round(219 - 152 * t), g = Math.round(234 - 129 * t), b = Math.round(254 - 8 * t);
      return `rgb(${r},${g},${b})`;
    }

    function render() {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, width, height);
      const data = currentStep >= 0 ? history[currentStep] : null;
      const radius = 9;
      const px = (i) => padding + (i - 1) * cellSize + cellSize / 2;
      const py = (j) => height - padding - (j - 1) * cellSize - cellSize / 2;

      for (let i = 1; i <= n; i++)
        for (let j = 1; j <= jmaxValues[i - 1]; j++)
          drawCircle(px(i), py(j), radius - 1, '#f0f0f0', '#e0e0e0', 0.5);

      for (let i = 1; i <= n; i++)
        drawCircle(px(i), py(jmaxValues[i - 1]), radius, '#ef4444', '#dc2626', 1);

      if (data) {
        // search bounds handed down by monotonicity, for the current state
        const cur = data.i;
        for (let j = data.lo; j <= data.hi; j++)
          drawCircle(px(cur), py(j), radius + 1, '#fef3c7', '#f59e0b', 2);

        // relevant bands found so far, shaded by choice probability
        for (const bd of data.bands)
          for (let j = bd.l; j <= bd.h; j++)
            drawCircle(px(bd.i), py(j), radius, bandColour(choiceProb(bd.i, j, sigma)), '#3b82f6', 1);

        // points where U was actually evaluated
        for (let b = 0; b < data.evals.length; b++) {
          const isCurrent = (b === data.evals.length - 1);
          for (const j of data.evals[b].points)
            drawCircle(px(data.evals[b].i), py(j), isCurrent ? radius : radius - 1,
                       null, isCurrent ? '#22c55e' : '#86efac', isCurrent ? 2 : 1);
        }

        drawCircle(px(data.i), py(data.g), radius + 2, '#22c55e', '#15803d', 2);

        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let s = 0; s <= currentStep; s++) {
          const h = history[s];
          ctx.fillStyle = s === currentStep ? '#166534' : '#1e40af';
          ctx.fillText((s + 1).toString(), px(h.i), py(h.g));
        }
      }

      ctx.fillStyle = '#333';
      ctx.font = 'italic 18px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('i', width / 2, height - 12);
      ctx.save();
      ctx.translate(15, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("i'", 0, 0);
      ctx.restore();

      updateStatus();
    }

    function updateStatus() {
      const el = document.getElementById('status');
      if (currentStep < 0) {
        el.innerHTML = '<p class="status-waiting">Press Play to start animation</p>';
        return;
      }
      const d = history[currentStep];
      const naive = n * n;
      const speed = (naive / d.total).toFixed(1);
      el.innerHTML =
        `<p class="status-step">Step ${currentStep + 1} / ${history.length}: state i = ${d.i}</p>
         <p class="status-detail">
           Search bounds from monotonicity: [${d.lo}, ${d.hi}]<br>
           Evaluated: {${d.ev.join(', ')}} (${d.ev.length} points) &rarr; g(${d.i}) = ${d.g}<br>
           Relevant band: [${d.l}, ${d.h}] &nbsp; (${d.h - d.l + 1} choices with P &ge; &epsilon;)
         </p>
         <p class="tally">${d.total} evaluations so far, against ${naive} for the naive algorithm (&times;${speed})</p>`;
    }

    function updateButtons() {
      document.getElementById('btnStepBack').disabled = currentStep <= 0;
      document.getElementById('btnStepForward').disabled = currentStep >= history.length - 1;
      document.getElementById('btnPlay').textContent = isPlaying ? '\u23F8 Pause' : '\u25B6 Play';
      document.getElementById('btnPlay').className = isPlaying ? 'btn btn-yellow' : 'btn btn-blue';
    }

    function showSigma() {
      document.getElementById('sigmaval').textContent = '\u03C3 = ' + sigma.toPrecision(2);
    }

    function play() {
      if (currentStep >= history.length - 1) currentStep = -1;
      isPlaying = true;
      if (currentStep < 0) currentStep = 0;
      render(); updateButtons();
      playTimer = setInterval(() => {
        if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); }
        else pause();
      }, playSpeed);
    }
    function pause() { isPlaying = false; if (playTimer) { clearInterval(playTimer); playTimer = null; } updateButtons(); }
    function stepBack() { if (currentStep > 0) { currentStep--; render(); updateButtons(); } }
    function stepForward() { if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); } }
    function replay() { pause(); currentStep = -1; setTimeout(play, 100); }

    document.getElementById('btnPlay').addEventListener('click', () => { isPlaying ? pause() : play(); });
    document.getElementById('btnStepBack').addEventListener('click', stepBack);
    document.getElementById('btnStepForward').addEventListener('click', stepForward);
    document.getElementById('btnReplay').addEventListener('click', replay);

    document.getElementById('sigma').addEventListener('input', (e) => {
      pause();
      sigma = sigmaFromSlider(Number(e.target.value));
      history = generateHistory(sigma);
      if (currentStep >= history.length) currentStep = history.length - 1;
      showSigma(); render(); updateButtons();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); isPlaying ? pause() : play(); }
      else if (e.code === 'ArrowLeft') stepBack();
      else if (e.code === 'ArrowRight') stepForward();
      else if (e.code === 'KeyR') replay();
    });

    showSigma(); render(); updateButtons();
  </script>
</body>
</html>
