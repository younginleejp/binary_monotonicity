<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Monotonicity with Taste Shocks (n=100) - Gordon (2019)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; display: flex; justify-content: center; padding: 20px; }
    .container { display: flex; flex-direction: column; align-items: center; }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 8px; font-family: Georgia, 'Times New Roman', serif; }
    .subtitle { font-size: 15px; color: #666; margin-bottom: 15px; font-style: italic; }
    canvas { border: 1px solid #e5e7eb; border-radius: 4px; }
    .legend { display: flex; gap: 20px; margin-top: 15px; font-size: 14px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-circle { width: 18px; height: 18px; border-radius: 50%; }
    .sigmabox { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 15px; }
    .sbtn { padding: 8px 18px; border: 2px solid #3b82f6; background: white; color: #3b82f6; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; font-family: Georgia, serif; }
    .sbtn.active { background: #3b82f6; color: white; }
    .controls { display: flex; gap: 12px; margin-top: 16px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-gray { background: #6b7280; color: white; }
    .btn-gray:hover:not(:disabled) { background: #4b5563; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover:not(:disabled) { background: #2563eb; }
    .btn-yellow { background: #f59e0b; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .status { margin-top: 15px; text-align: center; min-height: 70px; max-width: 640px; }
    .status-step { font-weight: 600; font-size: 16px; color: #333; }
    .status-detail { color: #666; font-size: 14px; margin-top: 5px; line-height: 1.5; }
    .status-waiting { color: #888; font-size: 15px; }
    .tally { margin-top: 4px; font-size: 14px; color: #1d4ed8; font-weight: 600; }
    .speed-control { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
    .speed-control input { width: 120px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Binary Monotonicity with Taste Shocks (n = n' = 100)</h1>
    <p class="subtitle">Gordon (2019), two-period example &nbsp;U(i,i&prime;) = log(b<sub>i</sub> &minus; b<sub>i&prime;</sub>/2) + log(b<sub>i&prime;</sub>)&nbsp; with &nbsp;b<sub>i</sub> = i</p>
    <canvas id="canvas"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-circle" style="background: #f0f0f0;"></div><span>Full grid</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #fef3c7; border: 2px solid #f59e0b;"></div><span>Evaluated (search region)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #93c5fd; border: 1px solid #3b82f6;"></div><span>Relevant band, shaded by P(i'|i)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #3b82f6;"></div><span>Previous g(i)</span></div>
      <div class="legend-item"><div class="legend-circle" style="background: #22c55e;"></div><span>Current g(i)</span></div>
    </div>

    <div class="sigmabox">
      <span>taste shock size</span>
      <button class="sbtn active" id="sig1">&sigma; = 0.01</button>
      <button class="sbtn" id="sig2">&sigma; = 0.0001</button>
    </div>

    <div class="controls">
      <button class="btn btn-gray" id="btnStepBack">&#9664; Step</button>
      <button class="btn btn-blue" id="btnPlay">&#9654; Play</button>
      <button class="btn btn-gray" id="btnStepForward">Step &#9654;</button>
      <button class="btn btn-green" id="btnReplay">&#8634; Replay</button>
    </div>
    <div class="speed-control">
      <span>Speed:</span>
      <input type="range" id="speedSlider" min="20" max="500" value="100">
      <span id="speedLabel">100ms</span>
    </div>
    <div class="status" id="status"><p class="status-waiting">Press Play to start animation</p></div>
  </div>

  <script>
    const n = 100;
    const cellSize = 6;
    const padding = 50;
    const width = n * cellSize + padding * 2;
    const height = n * cellSize + padding * 2;

    const canvas = document.getElementById('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    const EPS = 1e-16;                    // machine epsilon in double precision

    // Gordon (2019), section 2.1 : a two-period consumption-savings payoff on b_i = i.
    // Choices with b_i - b_j/2 <= 0 are infeasible and get minus infinity.
    function U(i, j) {
      const c = i - j / 2;
      return c > 0 ? Math.log(c) + Math.log(j) : -Infinity;
    }

    // choice probability, computed in a numerically safe way
    function choiceProb(i, j, sigma) {
      let mx = -Infinity;
      for (let k = 1; k <= n; k++) mx = Math.max(mx, U(i, k));
      let den = 0;
      for (let k = 1; k <= n; k++) den += Math.exp((U(i, k) - mx) / sigma);
      return Math.exp((U(i, j) - mx) / sigma) / den;
    }

    // evaluate U over [lo,hi] : peak, and the edges of the numerically relevant band
    function scan(i, lo, hi, sigma) {
      const cut = sigma * Math.log(EPS);
      let best = lo;
      for (let j = lo; j <= hi; j++) if (U(i, j) > U(i, best)) best = j;
      const ustar = U(i, best);
      let l = best, h = best;
      for (let j = lo; j <= hi; j++) if (U(i, j) - ustar >= cut) { l = j; break; }
      for (let j = hi; j >= lo; j--) if (U(i, j) - ustar >= cut) { h = j; break; }
      return { g: best, l, h, count: hi - lo + 1 };
    }

    // Algorithm 1 of Gordon (2019) : divide and conquer on the band edges
    function generateHistory(sigma) {
      const history = [];
      const L = new Array(n + 1).fill(0), H = new Array(n + 1).fill(0);
      const G = new Array(n + 1).fill(0), solved = new Array(n + 1).fill(false);
      const bands = [];
      let total = 0;

      function record(i, lo, hi) {
        const r = scan(i, lo, hi, sigma);
        L[i] = r.l; H[i] = r.h; G[i] = r.g; solved[i] = true;
        total += r.count;
        bands.push({ i, l: r.l, h: r.h });
        history.push({
          i, g: r.g, lo, hi, l: r.l, h: r.h, count: r.count, total,
          bands: bands.map(o => ({ ...o })), G: [...G], solved: [...solved]
        });
      }

      record(1, 1, n);
      record(n, L[1], n);
      const stack = [[1, n]];
      while (stack.length > 0) {
        const [a, b] = stack.pop();
        if (b - a <= 1) continue;
        const m = Math.floor((a + b) / 2);
        record(m, L[a], H[b]);
        stack.push([a, m]); stack.push([m, b]);
      }
      return history;
    }

    let sigma = 0.01;
    let history = generateHistory(sigma);
    let currentStep = -1, isPlaying = false, playTimer = null, playSpeed = 100;

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      playSpeed = parseInt(e.target.value);
      document.getElementById('speedLabel').textContent = playSpeed + 'ms';
      if (isPlaying) { pause(); play(); }
    });

    function drawCircle(x, y, radius, fill, stroke, strokeWidth) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeWidth; ctx.stroke(); }
    }

    // darker blue for a higher choice probability
    function bandColour(p) {
      const t = Math.max(0, Math.min(1, (Math.log10(p) + 16) / 16));
      const r = Math.round(219 - 152 * t), g = Math.round(234 - 129 * t), b = Math.round(254 - 8 * t);
      return `rgb(${r},${g},${b})`;
    }

    function render() {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, width, height);
      const data = currentStep >= 0 ? history[currentStep] : null;
      const radius = 2.5;
      const px = (i) => padding + (i - 1) * cellSize + cellSize / 2;
      const py = (j) => height - padding - (j - 1) * cellSize - cellSize / 2;

      for (let i = 1; i <= n; i++)
        for (let j = 1; j <= n; j++)
          drawCircle(px(i), py(j), radius - 0.5, '#f0f0f0', '#e0e0e0', 0.3);

      if (data) {
        // every range that has been evaluated so far, brighter for the current one
        for (let s = 0; s <= currentStep; s++) {
          const h = history[s];
          const cur = (s === currentStep);
          for (let j = h.lo; j <= h.hi; j++)
            drawCircle(px(h.i), py(j), cur ? radius + 0.5 : radius,
                       cur ? '#fef3c7' : '#fef9c3', cur ? '#f59e0b' : '#fcd34d', cur ? 1 : 0.5);
        }

        // the numerically relevant band, shaded by the choice probability
        for (const bd of data.bands)
          for (let j = bd.l; j <= bd.h; j++)
            drawCircle(px(bd.i), py(j), radius, bandColour(choiceProb(bd.i, j, sigma)), '#3b82f6', 0.4);

        for (let i = 1; i <= n; i++)
          if (data.solved[i] && i !== data.i)
            drawCircle(px(i), py(data.G[i]), radius, '#3b82f6', '#1d4ed8', 0.5);

        drawCircle(px(data.i), py(data.g), radius + 1.5, '#22c55e', '#15803d', 1);
      }

      ctx.fillStyle = '#333';
      ctx.font = 'italic 18px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('i', width / 2, height - 12);
      ctx.save();
      ctx.translate(15, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("i'", 0, 0);
      ctx.restore();

      updateStatus();
    }

    function updateStatus() {
      const el = document.getElementById('status');
      if (currentStep < 0) {
        el.innerHTML = '<p class="status-waiting">Press Play to start animation</p>';
        return;
      }
      const d = history[currentStep];
      const naive = n * n;
      el.innerHTML =
        `<p class="status-step">Step ${currentStep + 1} / ${history.length}: state i = ${d.i}</p>
         <p class="status-detail">
           Evaluated over [${d.lo}, ${d.hi}] &nbsp;(${d.count} points) &rarr; g(${d.i}) = ${d.g}<br>
           Relevant band: [${d.l}, ${d.h}] &nbsp;(${d.h - d.l + 1} choices with P &ge; &epsilon;), passed on to the next state
         </p>
         <p class="tally">${d.total} evaluations so far, against ${naive} for the naive algorithm (&times;${(naive / d.total).toFixed(1)})</p>`;
    }

    function updateButtons() {
      document.getElementById('btnStepBack').disabled = currentStep <= 0;
      document.getElementById('btnStepForward').disabled = currentStep >= history.length - 1;
      document.getElementById('btnPlay').textContent = isPlaying ? '\u23F8 Pause' : '\u25B6 Play';
      document.getElementById('btnPlay').className = isPlaying ? 'btn btn-yellow' : 'btn btn-blue';
    }

    function setSigma(s, btnOn, btnOff) {
      pause();
      sigma = s;
      history = generateHistory(sigma);
      if (currentStep >= history.length) currentStep = history.length - 1;
      document.getElementById(btnOn).classList.add('active');
      document.getElementById(btnOff).classList.remove('active');
      render(); updateButtons();
    }

    function play() {
      if (currentStep >= history.length - 1) currentStep = -1;
      isPlaying = true;
      if (currentStep < 0) currentStep = 0;
      render(); updateButtons();
      playTimer = setInterval(() => {
        if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); }
        else pause();
      }, playSpeed);
    }
    function pause() { isPlaying = false; if (playTimer) { clearInterval(playTimer); playTimer = null; } updateButtons(); }
    function stepBack() { if (currentStep > 0) { currentStep--; render(); updateButtons(); } }
    function stepForward() { if (currentStep < history.length - 1) { currentStep++; render(); updateButtons(); } }
    function replay() { pause(); currentStep = -1; setTimeout(play, 100); }

    document.getElementById('btnPlay').addEventListener('click', () => { isPlaying ? pause() : play(); });
    document.getElementById('btnStepBack').addEventListener('click', stepBack);
    document.getElementById('btnStepForward').addEventListener('click', stepForward);
    document.getElementById('btnReplay').addEventListener('click', replay);
    document.getElementById('sig1').addEventListener('click', () => setSigma(0.01, 'sig1', 'sig2'));
    document.getElementById('sig2').addEventListener('click', () => setSigma(0.0001, 'sig2', 'sig1'));

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); isPlaying ? pause() : play(); }
      else if (e.code === 'ArrowLeft') stepBack();
      else if (e.code === 'ArrowRight') stepForward();
      else if (e.code === 'KeyR') replay();
    });

    render(); updateButtons();
  </script>
</body>
</html>
